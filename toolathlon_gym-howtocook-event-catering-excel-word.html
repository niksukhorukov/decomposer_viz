<template id="tip-0"><div class="message"><p>You are working for an event catering company that has been hired to plan a corporate team building event menu for 30 people. Your task is to design a complete catering plan and get client approval.</p>
<p>Use the HowToCook recipe database to browse recipes across different categories. Select at least 8 dishes to create a full catering menu with appetizers, main courses, and at least one dessert or soup. Choose recipes that would work well for a corporate team building setting serving 30 people.</p>
<p>Create an Excel workbook called Catering_Plan.xlsx in your workspace with two sheets. The first sheet must be named Menu and include the columns Dish_Name, Category (use values like Appetizer, Main_Course, Soup, or Dessert), Servings_For_30 (the number of servings adjusted for 30 people, usually 6 times the recipe default), Prep_Time_Minutes (estimated preparation time as a number), and Estimated_Cost_USD (estimated cost in US dollars as a number, estimate $3-8 per serving for most dishes). The Menu sheet should have at least 8 data rows. The second sheet must be named Ingredients and include the columns Dish_Name, Ingredient, Quantity_For_30_People, and Unit.</p>
<p>Create a Word document called Catering_Proposal.docx in your workspace. Include an executive summary describing the event and your catering approach, a menu overview section listing all selected dishes with brief descriptions, and a preparation timeline section describing when each category of dish will be prepared on the event day.</p>
<p>Create a Google Form called &quot;Menu Approval Survey&quot; with questions to collect client feedback on the proposed menu. Include at least three questions: one asking the client to rate overall menu satisfaction, one asking which dishes they want to confirm or remove, and one asking for any special dietary requirements or additional notes.</p>
<p>Send an email to client@corporate.com with subject &quot;Catering Proposal for Team Building Event&quot; that summarizes the proposed menu and mentions that the Excel plan, Word proposal, and feedback form have been prepared.</p>
</div></template><template id="tip-1"><div class="message"><p>All four deliverables are complete and independently verified. Here's the summary:</p>

</div></template><template id="tip-3"><div class="message"><h2>HowToCook Recipe Database Overview &amp; Corporate Catering Menu Candidates</h2>
<h3>1. Recipe Database Location &amp; Organization</h3>
<p><strong>Directory Path:</strong> The HowToCook MCP server provides programmatic access via API functions, but underlying recipes are stored as Markdown files in a structured repository (inferred from <code>source_path</code> fields like <code>&quot;dishes/meat_dish/可乐鸡翅.md&quot;</code>).</p>
<p><strong>Organization/Naming Convention:</strong> Recipes are organized hierarchically by category:</p>
<ul>

<script>
const tooltip = document.getElementById("tooltip");
let hideTimer;
function hide() { tooltip.hidden = true; }
function delayHide() { hideTimer = setTimeout(hide, 180); }
function show(event) {
  clearTimeout(hideTimer);
  const marker = event.currentTarget;
  tooltip.replaceChildren(
    document.getElementById(marker.dataset.tooltip).content.cloneNode(true)
  );
  tooltip.hidden = false;
  tooltip.scrollTop = 0;
  const anchor = marker.getBoundingClientRect();
  const left = Math.max(12, Math.min(anchor.left, innerWidth - tooltip.offsetWidth - 12));
  const top = anchor.bottom + 8 + tooltip.offsetHeight <= innerHeight - 12
    ? anchor.bottom + 8 : Math.max(12, anchor.top - tooltip.offsetHeight - 8);
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
}
for (const marker of document.querySelectorAll("[data-tooltip]")) {
  marker.addEventListener("mouseenter", show);
  marker.addEventListener("focus", show);
  marker.addEventListener("click", show);
  marker.addEventListener("mouseleave", delayHide);
  marker.addEventListener("blur", delayHide);
}
tooltip.addEventListener("mouseenter", () => clearTimeout(hideTimer));
tooltip.addEventListener("mouseleave", delayHide);
tooltip.addEventListener("focus", () => clearTimeout(hideTimer));
tooltip.addEventListener("blur", delayHide);
document.addEventListener("keydown", event => { if (event.key === "Escape") hide(); });
document.addEventListener("click", event => {
  if (!event.target.closest("[data-tooltip], #tooltip")) hide();
});
document.querySelector(".chart").addEventListener("scroll", hide);
window.addEventListener("resize", hide);
window.addEventListener("scroll", hide);
</script>
