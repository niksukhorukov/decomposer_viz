<template id="tip-0"><div class="message"><p>Our support operations team needs a comprehensive performance review based on our support ticket data warehouse. Please query the support center database to gather ticket statistics broken down by priority level and by issue type. For each priority level, calculate the total number of tickets, the average response time in hours rounded to two decimal places, and the average customer satisfaction score rounded to two decimal places. You should also check what percentage of tickets met their SLA response time targets by comparing each ticket's response time against the SLA policy response target hours for that priority level. Additionally, retrieve the complete list of support agents with their team assignments and skill levels.</p>
<p>Once you have all the data, create an Excel file named Support_Analysis.xlsx in the workspace. The file should contain four sheets. The first sheet should be named &quot;Agent Roster&quot; and should list all agents sorted by name with columns Agent_Name, Team, and Skill_Level. The second sheet should be named &quot;Priority Analysis&quot; with columns Priority, Ticket_Count, Avg_Response_Hours, Avg_Satisfaction, and SLA_Compliance_Pct where the compliance percentage represents the proportion of tickets whose response time was within the SLA target for that priority. The third sheet should be named &quot;Issue Type Analysis&quot; with columns Issue_Type, Ticket_Count, Avg_Response_Hours, and Avg_Satisfaction, sorted by ticket count in descending order. The fourth sheet should be named &quot;Summary&quot; with two columns Metric and Value containing the following rows: Total_Agents with the count of agents, Total_Tickets with the overall ticket count, Overall_Avg_Response_Hours with the overall average response time rounded to two decimal places, and Overall_Avg_Satisfaction with the overall average satisfaction rounded to two decimal places.</p>
<p>After creating the Excel file, also create a shared spreadsheet containing just the summary data so that other stakeholders can view it. The spreadsheet should be titled &quot;Support Performance Summary&quot; and should have a single sheet called &quot;Summary&quot; with the same Metric and Value columns and the same four rows as the Summary sheet in the Excel file.</p>

<script>
const tooltip = document.getElementById("tooltip");
let hideTimer;
function hide() { tooltip.hidden = true; }
function delayHide() { hideTimer = setTimeout(hide, 180); }
function show(event) {
  clearTimeout(hideTimer);
  const marker = event.currentTarget;
  tooltip.replaceChildren(
    document.getElementById(marker.dataset.tooltip).content.cloneNode(true)
  );
  tooltip.hidden = false;
  tooltip.scrollTop = 0;
  const anchor = marker.getBoundingClientRect();
  const left = Math.max(12, Math.min(anchor.left, innerWidth - tooltip.offsetWidth - 12));
  const top = anchor.bottom + 8 + tooltip.offsetHeight <= innerHeight - 12
    ? anchor.bottom + 8 : Math.max(12, anchor.top - tooltip.offsetHeight - 8);
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
}
for (const marker of document.querySelectorAll("[data-tooltip]")) {
  marker.addEventListener("mouseenter", show);
  marker.addEventListener("focus", show);
  marker.addEventListener("click", show);
  marker.addEventListener("mouseleave", delayHide);
  marker.addEventListener("blur", delayHide);
}
tooltip.addEventListener("mouseenter", () => clearTimeout(hideTimer));
tooltip.addEventListener("mouseleave", delayHide);
tooltip.addEventListener("focus", () => clearTimeout(hideTimer));
tooltip.addEventListener("blur", delayHide);
document.addEventListener("keydown", event => { if (event.key === "Escape") hide(); });
document.addEventListener("click", event => {
  if (!event.target.closest("[data-tooltip], #tooltip")) hide();
});
document.querySelector(".chart").addEventListener("scroll", hide);
window.addEventListener("resize", hide);
window.addEventListener("scroll", hide);
</script>
